name: Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'preview-src/**', 'src/offline_studio/web/**', 'src/offline_studio/ui.py', 'scripts/build_ui_preview.py', 'integrations.lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/install.py --minimal
      - run: python scripts/build_ui_preview.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - uses: actions/deploy-pages@v5
        id: deployment
