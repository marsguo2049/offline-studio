name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/install.py --minimal
      - run: python scripts/build_ui_preview.py --check
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python scripts/privacy_check.py
