[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-studio"
version = "0.1.0"
description = "A unified local AI workbench for documents, images, comics and video."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "PolyForm Noncommercial License 1.0.0"}
dependencies = ["comfyui-py-workflow==0.5.0", "python-docx>=1.2,<2", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
offline-studio = "offline_studio.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
offline_studio = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
